<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b1f" />
  <title>Preis-Schätzer</title>
  <meta name="description" content="Das Online-Partyspiel: Schätz Preise von Windrädern, Fußballstars, Supercars und mehr." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hintergrund" aria-hidden="true"></div>

  <header class="topbar">
    <div class="logo"><span class="muenze">€</span>PREIS<span class="punkt">·</span>SCHÄTZER</div>
    <div class="topbar-rechts">
      <button id="raumChip" class="raum-chip versteckt" title="Einladungslink kopieren"></button>
      <button id="tonBtn" class="icon-btn" title="Ton an/aus" aria-label="Ton an/aus">🔊</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="intro" class="intro versteckt" aria-live="polite"></div>
  <div id="toast" class="toast versteckt" role="status"></div>
  <canvas id="konfetti" aria-hidden="true"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="ton.js"></script>
  <script src="app.js"></script>
</body>
</html>
