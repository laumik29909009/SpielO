<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#120b26" />
  <title>SpielO</title>
  <meta name="description" content="Euer Spieleabend im Browser: Preis-Schätzer, Stadt Land Fluss und mehr." />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SpielO" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hintergrund" aria-hidden="true"></div>

  <header class="topbar">
    <div class="logo"><span class="spielo-logo klein" aria-label="SpielO"><span class="b">Spiel</span><span class="o-chip"><span class="o-zeichnen"><span class="o-ring"></span></span><span class="o-punkt"></span></span></span></div>
    <div class="topbar-rechts">
      <button id="raumChip" class="raum-chip versteckt" title="Einladungslink kopieren"></button>
      <button id="stoppSpielBtn" class="icon-btn versteckt" title="Spiel abbrechen" aria-label="Spiel abbrechen">⏹</button>
      <button id="tonBtn" class="icon-btn" title="Ton an/aus" aria-label="Ton an/aus">🔊</button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="seiten-fuss">
    <span>SpielO by laumik</span>
    <span class="klein">Bilder: Wikipedia / Wikimedia Commons</span>
  </footer>

  <div id="intro" class="intro versteckt" aria-live="polite"></div>
  <div id="toast" class="toast versteckt" role="status"></div>
  <canvas id="konfetti" aria-hidden="true"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="ton.js"></script>
  <script src="kern.js"></script>
  <script src="spiele/preis.js"></script>
  <script src="spiele/slf.js"></script>
</body>
</html>
